name: Full Test Suite (Develop)


on:
  push:
    branches: [ develop ]


jobs:
  full-playwright:
    name: Full Playwright Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}


    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      - run: npm ci


      - run: npx playwright install --with-deps chromium


      - name: Start server
        run: |
          npm start &
          echo "Waiting for server..."
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && echo "Server ready!" && break
            echo "Attempt $i, retrying in 3s..."
            sleep 3
          done


      - name: Run full Playwright suite
        run: npx playwright test


      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-playwright-report
          path: playwright-report/
          retention-days: 14


  regression-gate:
    name: RAG Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: full-playwright
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}


    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      - run: npm ci


      - run: npm install -g promptfoo


      - name: Start server
        run: |
          npm start &
          echo "Waiting for server..."
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && echo "Server ready!" && break
            echo "Attempt $i, retrying in 3s..."
            sleep 3
          done


      - name: Run regression gate
        run: npm run eval:regression


  red-team:
    name: Adversarial Red Team
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: full-playwright
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}


    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      - run: npm ci


      - name: Start server
        run: |
          npm start &
          echo "Waiting for server..."
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && echo "Server ready!" && break
            echo "Attempt $i, retrying in 3s..."
            sleep 3
          done


      - name: Run red team
        run: npm run eval:redteam