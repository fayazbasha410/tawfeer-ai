name: Deploy to Render


on:
  push:
    branches: [ main ]


jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5


    steps:
      - name: Call Render Deploy Hook
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Deploy triggered."