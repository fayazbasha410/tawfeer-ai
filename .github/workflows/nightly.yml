name: Nightly Quality Gate


on:
  workflow_dispatch: # manual trigger only — runs only from GitHub Actions tab when needed


jobs:
  nightly-full-eval:
    name: Full RAG Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}


    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'


      - run: npm ci


      - run: npm install -g promptfoo


      - name: Start server
        run: |
          npm start &
          echo "Waiting for server..."
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && echo "Server ready!" && break
            echo "Attempt $i, retrying in 3s..."
            sleep 3
          done


      - name: Run full eval
        run: npm run eval


      - name: Run regression gate
        run: npm run eval:regression


      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-eval-${{ github.run_number }}
          path: /tmp/govmurshid-eval.json
          retention-days: 30


  nightly-red-team:
    name: Nightly Red Team
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}


    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'


      - run: npm ci


      - name: Start server
        run: |
          npm start &
          echo "Waiting for server..."
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && echo "Server ready!" && break
            echo "Attempt $i, retrying in 3s..."
            sleep 3
          done


      - name: Run red team
        run: npm run eval:redteam


  nightly-accessibility:
    name: Nightly Accessibility Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}


    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'


      - run: npm ci


      - run: npx playwright install --with-deps chromium


      - name: Start server
        run: |
          npm start &
          echo "Waiting for server..."
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && echo "Server ready!" && break
            echo "Attempt $i, retrying in 3s..."
            sleep 3
          done


      - name: Run accessibility tests
        run: npx playwright test tests/specs/ui/accessibility.spec.js


      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-a11y-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30