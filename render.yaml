services:
  - type: web
    name: tawfeer-ai
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000